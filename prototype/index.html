function messageHTML(msg,conv){const ref=msg.replyTo?getConv(conv)?.messages.find(m=>m.id===msg.replyTo):null;return `<article class="message ${ui.highlight===msg.id?'highlight':''} ${msg.deleted?'removed':''}" id="msg-${esc(msg.id)}">${avatar(msg.sender)}<div class="grow"><div class="msg-meta"><strong>${esc(msg.sender)}</strong><span>${time(msg.time)} · ${date(msg.time).slice(0,5)}</span><span>#${esc(msg.id)}</span>${msg.revision?pill('Nguồn đã thay đổi','amber'):''}</div>${ref?`<div class="reply">Trả lời #${esc(ref.id)} · ${ref.deleted?'Tin nhắn đã xóa':esc(ref.text)}</div>`:''}<p>${msg.deleted?'Tin nhắn nguồn đã bị xóa trong mô phỏng.':esc(msg.text)}</p></div></article>`}
function analysisStatus(){if(ui.busy)return `<div class="status-strip" role="status"><span class="spinner"></span>Đang phân tích bộ mẫu... Dữ liệu đã xác nhận được giữ nguyên.</div>`;if(ui.analysis?.type==='error')return `<div class="alert red" style="margin-bottom:20px" role="alert">${icon('info')}<div class="grow">${esc(ui.analysis.text)}</div>${button('Thử lại','analyze','','sm','refresh')}</div>`;if(ui.analysis)return `<div class="alert ${ui.analysis.type==='success'?'green':'amber'}" style="margin-bottom:20px" role="status">${icon('info')}<div>${esc(ui.analysis.text)}</div></div>`;return ''}
function renderConversations(){const convs=db.conversations.filter(c=>canConv(c.id));if(!canConv(ui.selectedConv))ui.selectedConv=convs[0]?.id;const c=getConv(ui.selectedConv);return heading('NGUỒN CỦA MỖI CAM KẾT',`Hội thoại ${noteMark('F01')}`,'Đọc ngữ cảnh trước, phân tích sau. Mỗi quyết định đều có điểm bắt đầu.',button('Dán hội thoại','import','','','plus')+button('Tải JSON mẫu','download','','','download')+button('Dùng kịch bản mẫu','scenarios','','primary','spark'))+analysisStatus()+`<div class="conversation-layout"><aside class="card conversation-list">${convs.map(c=>`<button class="conversation-item ${c.id===ui.selectedConv?'active':''}" data-act="conv" data-id="${esc(c.id)}"><strong># ${esc(c.title)}</strong><small>${c.messages.length} tin nhắn · ${c.members.length} thành viên</small></button>`).join('')}</aside><section class="card">${c?`<div class="chat-header"><div class="row between"><div><h3># ${esc(c.title)} ${noteMark('F04')}</h3><p class="small muted" style="margin-top:5px">${esc(c.topic)} · Dữ liệu xem trước</p></div><div class="avatars">${c.members.map(avatar).join('')}</div></div></div><div class="messages">${c.messages.map(m=>messageHTML(m,c.id)).join('')||empty('Hội thoại chưa có tin','Dán hoặc nhập dữ liệu mẫu để bắt đầu.','import','Dán hội thoại','chat')}</div>${db.lastAnalysis[c.id]?`<div class="analysis-result">${esc(db.lastAnalysis[c.id])}</div>`:''}<div class="chat-footer"><div class="row between wrap"><span class="small muted">${noteMark('F03')} Phân tích mô phỏng · Không có API AI thật</span><div class="row">${button('Thử lỗi xử lý','fail-next','','sm','info')}<button class="btn primary" data-act="analyze" ${ui.busy?'disabled':''}>${ui.busy?'<span class="spinner"></span>':icon('spark')}${ui.busy?'Đang phân tích...':'Phân tích hội thoại'}</button></div></div></div>`:empty('Chưa có hội thoại','Dùng kịch bản mẫu để bắt đầu.','scenarios')}</section></div>`}
function proposalCard(p){const t=getTask(p.taskId),c=getConv(p.conv),unresolved=p.status==='Cần làm rõ',current=t?snap(t):null;return `<article class="card proposal" id="proposal-${esc(p.id)}"><div class="row between wrap"><span class="pill no-dot ${p.kind==='new'?'purple':'blue'}">${icon(p.kind==='new'?'spark':'refresh')}${kindLabel(p.kind)}</span>${pill(p.status)}</div><h3>${esc(p.title)}</h3><div class="small muted"># ${esc(c?.title||'')} · Chủ đề: ${esc(c?.topic||'')}</div>${t?`<div class="compare"><div><small>Thông tin hiện hành</small><strong>${p.kind==='deadline'?fullDate(t.due):p.kind==='owner'?esc(t.owner):esc(t.status)}</strong></div><div><small>Thay đổi được đề xuất</small><strong>${p.kind==='deadline'?fullDate(p.due):p.kind==='owner'?esc(p.owner||'Chưa xác định'):esc(p.taskStatus)}</strong></div></div>`:`<div class="proposal-meta"><div><small>Người phụ trách</small>${p.owner?esc(p.owner):'<span style="color:var(--amber)">Chưa xác định</span>'}</div><div><small>Thời hạn</small>${fullDate(p.due)}</div><div><small>Trạng thái công việc dự kiến</small>${esc(p.taskStatus)}</div><div><small>Mã đề xuất</small>${esc(p.id)}</div></div>`}${p.manual?.length?`<div class="alert amber">${icon('edit')}<div>Do người dùng bổ sung: ${esc(p.manual.join(', '))}.${p.feedback?' Phản hồi thành viên: '+esc(p.feedback):''}</div></div>`:''}${p.reason?`<p class="small" style="color:${unresolved?'var(--amber)':'#1a2029'};margin-top:12px">${esc(p.reason)}</p>`:''}${p.evidence.map(id=>`<button class="evidence-link" data-act="evidence" data-id="${esc(p.conv)}|${esc(id)}">${icon('link')}<span class="grow">#${esc(id)} · ${esc(c?.messages.find(m=>m.id===id)?.deleted?'Nguồn đã bị xóa':c?.messages.find(m=>m.id===id)?.text||'Nguồn cần rà soát')}</span>${icon('arrow')}</button>`).join('')}${['Chờ duyệt','Cần làm rõ'].includes(p.status)?`<div class="proposal-actions">${unresolved?button('Làm rõ thông tin','clarify',p.id,'primary','chat'):isLead()?button(t?'Duyệt cập nhật':'Xác nhận','approve',p.id,'primary','check'):button('Gửi phản hồi','clarify',p.id,'primary','chat')}${button(isLead()?'Sửa rồi xác nhận':'Đề nghị chỉnh sửa','edit-proposal',p.id,'','edit')}${isLead()?button('Bác bỏ','reject',p.id,'ghost'):''}${!unresolved?button('Yêu cầu làm rõ','request-clarify',p.id,'ghost'):''}</div>`:`<div class="small muted" style="margin-top:15px">${esc(p.reviewedBy||'Lan')} · ${fullDate(p.reviewedAt)}${p.rejectReason?' · Lý do: '+esc(p.rejectReason):''}</div>`}</article>`}
function renderReview(){const list=visibleProposals().filter(p=>ui.reviewFilter==='all'||(ui.reviewFilter==='pending'?['Chờ duyệt','Cần làm rõ'].includes(p.status):p.status===ui.reviewFilter));const convId=list.find(p=>p.conv===ui.selectedConv)?.conv||list[0]?.conv;const c=getConv(convId);return heading('AI GỢI Ý · BẠN QUYẾT ĐỊNH',`Hàng chờ duyệt ${noteMark('F05')}`,'Đề xuất chưa được duyệt sẽ không thay đổi công việc chính thức.',`${noteMark('F07')}${button('Dùng kịch bản mẫu','scenarios','','','spark')}`)+`<div class="row wrap" style="margin-bottom:20px"><label class="field"><span class="sr">Lọc đề xuất</span><select id="review-filter"><option value="pending" ${ui.reviewFilter==='pending'?'selected':''}>Chờ xử lý (${pending().length})</option><option value="all" ${ui.reviewFilter==='all'?'selected':''}>Tất cả (${visibleProposals().length})</option><option ${ui.reviewFilter==='Đã duyệt'?'selected':''}>Đã duyệt</option><option ${ui.reviewFilter==='Bị bác bỏ'?'selected':''}>Bị bác bỏ</option></select></label><span class="small muted">${isLead()?'Bạn có quyền phê duyệt trong nhóm A.':'Bạn có thể phản hồi đề xuất liên quan đến mình; Lan sẽ phê duyệt.'}</span></div>${!list.length?`<section class="card">${empty('Hàng chờ đã gọn gàng','Chưa có đề xuất trong bộ lọc này. Bạn có thể phân tích một hội thoại mẫu.','scenarios')}</section>`:`<div class="review-layout"><section class="card"><div class="card-head"><div class="eyebrow" style="margin-bottom:10px">01 / HỘI THOẠI NGUỒN</div><h3># ${esc(c?.title||'')}</h3><p class="small muted" style="margin-top:5px">Đọc cả ngữ cảnh và tin nhắn chốt quyết định.</p></div><div class="messages">${c?.messages.map(m=>messageHTML(m,c.id)).join('')||''}</div><div class="card-body" style="border-top:1px solid var(--line)">${button('Mở hội thoại đầy đủ','open-conv',c?.id,'','chat')}</div></section><section><div class="eyebrow" style="margin:0 0 15px 3px">02 / ĐỀ XUẤT AI · ${list.length} KẾT QUẢ</div>${list.map(proposalCard).join('')}</section></div>`}`}
function reminderCard(r){const t=getTask(r.taskId);if(!t)return '';return `<article class="card reminder"><div class="row between wrap">${pill(r.status)}<span class="small muted">${esc(r.id)}</span></div><h3><button class="link-btn" style="font-size:15px;color:var(--ink)" data-act="detail" data-id="${esc(t.id)}">${esc(t.title)}</button></h3><div class="reminder-preview">“${esc(r.content)}”</div><div class="reminder-info">${icon('user')}Người nhận: ${esc(r.recipient)}</div><div class="reminder-info">${icon('calendar')}${fullDate(r.at)}</div><div class="reminder-info">${icon('clock')}Asia/Ho_Chi_Minh</div>${r.review?`<div class="alert amber" style="margin-top:14px">${icon('info')}Cần rà soát: deadline hoặc bằng chứng đã thay đổi. Giờ nhắc cũ được giữ để bạn kiểm tra và duyệt lại.</div>`:''}<div class="proposal-actions">${isLead()&&r.status==='Chờ duyệt'?button(r.review?'Rà soát & sửa':'Duyệt nhắc việc',r.review?'edit-reminder':'approve-reminder',r.id,'primary','check'):''}${isLead()&&r.status==='Đã duyệt'?button(r.review?'Rà soát trước khi gửi':'Mô phỏng đến giờ gửi',r.review?'edit-reminder':'send-reminder',r.id,'primary','send'):''}${isLead()&&['Chờ duyệt','Đã duyệt'].includes(r.status)?button('Sửa','edit-reminder',r.id,'','edit')+button('Hủy','cancel-reminder',r.id,'ghost'):''}${button('Lịch sử','reminder-history',r.id,'ghost','history')}${!isLead()?'<span class="small muted">Chỉ Lan có quyền duyệt, sửa và gửi mô phỏng.</span>':''}</div></article>`}
function renderReminders(){const reminders=visibleReminders();return heading('ĐÚNG NGƯỜI · ĐÚNG THỜI ĐIỂM',`Nhắc việc ${noteMark('F09')}`,'Xem trước và duyệt từng lời nhắc. Mọi thao tác gửi đều là mô phỏng.',isLead()?button('Tạo đề xuất nhắc','new-reminder','','primary','plus'):'')+`<div class="alert" style="margin-bottom:22px">${icon('info')}Duyệt công việc không đồng nghĩa duyệt nhắc việc. Bản nháp chỉ hoạt động sau khi được duyệt riêng.</div>${reminders.length?`<div class="reminder-grid">${reminders.map(reminderCard).join('')}</div>`:`<section class="card">${empty('Chưa có lời nhắc nào','Tạo lời nhắc cho một công việc đã xác nhận. Nội dung và thời điểm luôn cần được duyệt.',isLead()?'new-reminder':'','Tạo đề xuất nhắc','bell')}</section>`}`}
const EVAL=[{id:'E01',text:'Nam hoàn thành báo cáo trước 17:00 ngày 20/11/2026.',truth:true,pred:true,src:true,state:true,latency:240,scenario:'clear'},{id:'E02',text:'Mai gửi proposal nhé.',truth:true,pred:true,src:true,state:true,latency:310,scenario:'ambiguous'},{id:'E03',text:'API đã hoàn thành.',truth:true,pred:true,src:true,state:true,latency:220,scenario:'mixed'},{id:'E04',text:'Phần giao diện chuyển sang thứ Hai.',truth:true,pred:true,src:false,state:false,latency:280,scenario:'mixed'},{id:'E05',text:'Hôm nay trời đẹp quá.',truth:false,pred:true,src:false,state:null,latency:190,scenario:'ordinary'},{id:'E06',text:'Đồng ý, chốt ngày 23/11.',truth:true,pred:false,src:null,state:false,latency:320,scenario:'deadline'},{id:'E07',text:'Cảm ơn cả nhóm!',truth:false,pred:false,src:null,state:null,latency:160,scenario:'ordinary'}];
function metrics(){const tp=EVAL.filter(e=>e.truth&&e.pred).length,fp=EVAL.filter(e=>!e.truth&&e.pred).length,fn=EVAL.filter(e=>e.truth&&!e.pred).length;return {tp,fp,fn,p:tp/(tp+fp)||0,r:tp/(tp+fn)||0,f:2*tp/(2*tp+fp+fn)||0}}
function renderEvaluation(){const a=metrics(),pred=EVAL.filter(e=>e.pred),states=EVAL.filter(e=>e.state!==null);return heading('ĐO LƯỜNG ĐỂ HIỂU SAI SÓT',`Đánh giá AI ${noteMark('F10')}`,'Bộ đánh giá cố định có nhãn chuẩn, độc lập với các lần bấm phân tích demo.')+`<div class="alert amber">${icon('info')}Kết quả minh họa trên dữ liệu giả lập. Các dự đoán cố ý chứa lỗi để trình diễn phương pháp đánh giá, không đại diện chất lượng AI thực tế.</div><div class="metric-grid">${[['Precision',a.p,'Trong các kết quả dự đoán có việc, bao nhiêu là đúng?',`${a.tp} / (${a.tp} + ${a.fp})`],['Recall',a.r,'Trong các mẫu thực sự có việc, tìm được bao nhiêu?',`${a.tp} / (${a.tp} + ${a.fn})`],['F1',a.f,'Trung bình điều hòa của Precision và Recall.',`2TP / (2TP + FP + FN)`]].map(([n,v,d,f])=>`<div class="card metric"><div><h3>${n}</h3><strong>${(v*100).toFixed(1)}<small>%</small></strong></div><div><p>${d}</p><p style="margin-top:8px">${f}</p></div></div>`).join('')}</div><div class="row wrap" style="gap:10px;margin-bottom:22px">${pill('TP: '+a.tp,'green')}${pill('FP: '+a.fp,'red')}${pill('FN: '+a.fn,'amber')}<span class="small muted">TP: đúng dương · FP: báo nhầm · FN: bỏ sót · Không áp dụng ngưỡng đạt</span></div><div class="card"><div class="card-head"><h3>Đối chiếu dự đoán và nhãn chuẩn</h3></div><div class="table-wrap"><table class="mapping-table"><thead><tr><th>Mẫu</th><th>Tin nhắn</th><th>Nhãn chuẩn</th><th>Dự đoán</th><th>Kết quả</th><th></th></tr></thead><tbody>${EVAL.map(e=>`<tr><td>${e.id}</td><td>${esc(e.text)}</td><td>${e.truth?'Có việc':'Trao đổi thường'}</td><td>${e.pred?'Có việc':'Trao đổi thường'}</td><td>${pill(e.truth?(e.pred?'TP':'FN'):(e.pred?'FP':'TN'),e.truth===e.pred?'green':'red')}${e.src===false?'<div style="margin-top:7px;color:var(--red);font-size:11px">Sai nguồn</div>':''}</td><td><button class="link-btn" data-act="eval-sample" data-id="${e.id}">Xem mẫu ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div></div><div class="bottom-grid"><div class="card card-body"><h3>Nguồn, trạng thái và độ trễ mô phỏng</h3><div class="detail-grid"><div class="detail-item"><small>Đúng nguồn / dự đoán dương</small><strong>${pred.filter(e=>e.src).length}/${pred.length} · ${(pred.filter(e=>e.src).length/pred.length*100).toFixed(1)}%</strong></div><div class="detail-item"><small>Đúng trạng thái / mẫu có nhãn trạng thái</small><strong>${states.filter(e=>e.state).length}/${states.length} · ${(states.filter(e=>e.state).length/states.length*100).toFixed(1)}%</strong></div><div class="detail-item"><small>Độ trễ trung bình giả lập</small><strong>${Math.round(EVAL.reduce((s,e)=>s+e.latency,0)/EVAL.length)} ms</strong></div></div><p class="guide-note">Nguồn và trạng thái có nhãn riêng trong bộ đánh giá. Độ trễ là giá trị giả lập có sẵn, không phải đo hiệu năng hệ thống thật.</p></div><div class="card card-body"><h3>Những lỗi cần xem lại</h3>${EVAL.filter(e=>e.truth!==e.pred||e.src===false||e.state===false).map(e=>`<div style="margin-top:15px"><button class="link-btn" data-act="eval-sample" data-id="${e.id}">${e.id} · ${e.truth!==e.pred?(e.pred?'Nhận nhầm trao đổi thường':'Bỏ sót quyết định'):'Ghép sai nguồn / trạng thái'} ${icon('arrow')}</button></div>`).join('')}</div></div>`}
function renderGuide(){return heading('ĐI MỘT VÒNG CHAT-22','Từ tin nhắn đến việc được xác nhận','Hướng dẫn trình diễn, phạm vi mô phỏng và các quy tắc sản phẩm.',button('Chọn kịch bản demo','scenarios','','primary','spark'))+`<section class="card card-body"><div class="row between"><h2>Luồng trải nghiệm</h2><span class="pill no-dot blue">MVP · 6 màn hình</span></div><div class="spacer"></div><div class="flow-chart">${[['conversations','Hội thoại'],['conversations','Phân tích'],['review','Đề xuất AI'],['review','Kiểm tra & duyệt'],['tasks','Công việc'],['review','Duyệt cập nhật'],['tasks','Lịch sử & nguồn'],['reminders','Duyệt nhắc việc']].map(([p,l],i)=>`${i?icon('arrow'):''}<button data-go="${p}">${l}</button>`).join('')}</div><div class="branch"><span>Chưa rõ → Hỏi lại → Bổ sung → Duyệt</span><span>Bác bỏ → Ghi lý do → Giữ dữ liệu cũ</span><span>Lỗi xử lý → Thử lại → Không mất task</span><span>Không có quyền → Từ chối chung</span></div></section><div class="spacer"></div><div class="guide-grid"><section class="card card-body"><h3>Kịch bản demo trong 5 phút</h3><div class="checklist">${[['01','0:00–0:40 · Chọn Lan, mở mẫu Giao việc rõ ràng; xem nguồn và phân tích.'],['02','0:40–1:20 · Kiểm tra bằng chứng, xác nhận; mở công việc trong danh sách.'],['03','1:20–2:00 · Mở câu mơ hồ, chọn nghĩa của “Mai”, bổ sung người và thời hạn.'],['04','2:00–2:50 · Mở mẫu Đổi deadline: đối chiếu 20/11 → 23/11, duyệt và xem lịch sử.'],['05','2:50–3:40 · Tạo nhắc việc; duyệt riêng rồi mô phỏng đến giờ gửi.'],['06','3:40–4:20 · Chuyển sang Nam, thử phản hồi và thử truy cập ngoài quyền.'],['07','4:20–5:00 · Chạy lại phân tích, thử lỗi, đổi nguồn và xem chỉ số minh họa.']].map(([id,s])=>`<label><input type="checkbox" data-check="${id}" ${db.checklist[id]?'checked':''}>${s}</label>`).join('')}</div><div class="divider"></div><h3>Vai trò và giả định quyền</h3><p>Lan được xem nhóm A, duyệt tạo/cập nhật công việc, duyệt và hủy nhắc việc. Nam xem công việc của mình, hai hội thoại chung và phản hồi đề xuất liên quan; không tự áp dụng thay đổi chính thức.</p><p style="margin-top:10px">Ma trận này là giả định thiết kế, cần nhóm xác nhận. Nhóm B không thuộc quyền của cả hai tài khoản demo.</p><div class="row wrap" style="margin-top:17px">${button('Chọn tài khoản demo','role','','','users')}${button('Thử mở tài nguyên ngoài quyền','access','','','shield')}</div></section><section class="card card-body"><h3>Giả định và giới hạn</h3><ul><li>Đồng hồ cố định: 09:00 ngày 16/11/2026, Asia/Ho_Chi_Minh.</li><li>Tiếp nhận bằng dán văn bản hoặc nhập JSON; không cần API key, không có backend.</li><li>Chưa tích hợp Zalo, Slack, Teams hoặc hệ thống chat thật.</li><li>AI được mô phỏng bằng các câu mẫu cố định. Văn bản khác được thông báo giới hạn rõ ràng.</li><li>Đăng nhập, phân quyền, gửi phản hồi và nhắc việc là mô phỏng. Không gửi thông báo ra bên ngoài.</li><li>Chỉ trạng thái dữ liệu mẫu lưu trong localStorage. Nội dung nhập riêng chỉ giữ trong bộ nhớ tab; không dùng thông tin thật.</li><li>Phân quyền frontend chỉ minh họa hành vi. Hệ thống thật cần kiểm tra quyền tại tầng truy xuất trước khi cấp dữ liệu cho AI.</li></ul><div class="divider"></div><h3>Giai đoạn sau</h3><p>Quan hệ phụ thuộc giữa công việc, tích hợp lịch, tổng hợp khối lượng nhân sự, phát hiện xung đột và phân tích nâng cao. Các chức năng này chưa hoạt động trong MVP.</p><div class="divider"></div><p class="guide-note">Hướng dẫn theo PRD trong thư mục dự án. Bảng đối chiếu dưới đây mô tả phần đã hiện thực và phần chỉ mô phỏng, không tuyên bố đã có cơ chế bảo mật thật.</p></section></div><div class="spacer"></div><section class="card"><div class="card-head"><h2>Đối chiếu FR01–FR10</h2><p class="guide-note" style="margin-top:6px">Bấm tên chức năng để mở đúng khu vực trình diễn.</p></div><div class="table-wrap"><table class="mapping-table"><thead><tr><th>Mã</th><th>Chức năng</th><th>Hiện thực trong prototype</th><th>Quy tắc liên quan</th></tr></thead><tbody>${FR.map(([id,n,p,d,b])=>`<tr><td>${id}</td><td><button class="link-btn" ${p==='role'?'data-act="role"':`data-go="${p}"`}>${n}</button></td><td>${d}</td><td>${b}</td></tr>`).join('')}</tbody></table></div></section><div class="spacer"></div><section class="card"><div class="card-head"><h2>Đối chiếu BR01–BR14</h2></div><div class="table-wrap"><table class="mapping-table"><thead><tr><th>Mã</th><th>Quy tắc nghiệp vụ</th><th>Cách kiểm chứng</th></tr></thead><tbody>${BR.map(([id,n,d])=>`<tr><td>${id}</td><td>${n}</td><td>${d}</td></tr>`).join('')}</tbody></table></div></section>`}
function renderNote(){const el=document.getElementById('note'),n=NOTES[ui.note];el.hidden=!db.notes||!n;if(el.hidden)return;el.className='note-panel';el.innerHTML=`<div class="row between"><span class="note-label">${icon('info')} Ghi chú chức năng</span><button class="icon-btn" data-act="close-note" aria-label="Đóng ghi chú">${icon('close')}</button></div><h2>${ui.note} — ${n[0]}</h2><h4>Mục đích</h4><p>${n[1]}</p><h4>Cách thao tác</h4><p>${n[2]}</p><h4>Kết quả mong đợi</h4><p>${n[3]}</p><h4>Quy tắc nghiệp vụ</h4><p>${n[5]}</p><div class="note-rules">${n[4]}</div>${button('Xem hướng dẫn đầy đủ','note-guide','','','book')}`}
</script>
<script>
const DIALOG=document.getElementById('dialog');
function dialogHead(title,sub=''){return `<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="icon-btn" data-act="close-dialog" aria-label="Đóng hộp thoại">${icon('close')}</button></div>`}
function openDialog(type,id='',extra){ui.modal={type,id,extra};DIALOG.classList.toggle('wide',['detail','scenarios','import'].includes(type));DIALOG.innerHTML=dialogContent(type,id,extra);if(!DIALOG.open)DIALOG.showModal();if(type==='clarify')updateClarifyPreview()}
function closeDialog(){DIALOG.close();ui.modal=null;ui.importError=''}
function showModalNote(id){const n=NOTES[id];if(!n)return;DIALOG.querySelector('.inline-note')?.remove();DIALOG.querySelector('.dialog-body')?.insertAdjacentHTML('afterbegin',`<section class="inline-note"><div class="row between"><span class="eyebrow">Ghi chú chức năng</span><button class="icon-btn" data-act="close-modal-note" aria-label="Đóng ghi chú">${icon('close')}</button></div><h3>${id} — ${n[0]}</h3><p><b>Mục đích:</b> ${n[1]}</p><p><b>Cách thao tác:</b> ${n[2]}</p><p><b>Kết quả mong đợi:</b> ${n[3]}</p><p><b>Quy tắc:</b> ${n[5]}</p><p class="blue">${n[4]}</p></section>`)}
function dialogContent(type,id,extra){
 if(type==='role')return dialogHead('Chọn tài khoản demo','Không cần mật khẩu · Đăng nhập và quyền được mô phỏng')+`<div class="dialog-body"><div class="role-grid">${['Lan','Nam'].map(n=>`<button class="role-card ${db.user===n?'selected':''}" data-act="set-role" data-id="${n}">${avatar(n)}<strong>${n} — ${n==='Lan'?'Trưởng nhóm':'Thành viên'}</strong><p>${n==='Lan'?'Xem nhóm A, kiểm tra nguồn, duyệt tạo và cập nhật công việc, phê duyệt nhắc việc.':'Xem việc của mình và hội thoại được cấp quyền, phản hồi đề xuất; gửi yêu cầu để trưởng nhóm duyệt.'}</p><span class="pill no-dot ${n===db.user?'blue':''}">${n===db.user?'Đang sử dụng':'Sử dụng tài khoản này'}</span></button>`).join('')}</div><div class="alert" style="margin-top:20px">${icon('info')}Đây là giả định thiết kế về quyền. Prototype không có cơ chế xác thực hoặc bảo mật backend thật.</div>${noteMark('F02')}</div>`;
 if(type==='access')return dialogHead('Không thể truy cập tài nguyên')+`<div class="dialog-body">${empty('Bạn không có quyền truy cập','Tài nguyên không khả dụng trong phạm vi tài khoản hiện tại. Liên hệ người quản lý để kiểm tra quyền.','','','shield')}</div><div class="dialog-footer">${button('Quay lại','close-dialog','','primary')}</div>`;
 if(type==='member-request'){const t=getTask(id);if(!t)return dialogContent('access');return dialogHead('Gửi yêu cầu chỉnh sửa',esc(t.title))+`<form id="member-request-form" data-id="${esc(t.id)}"><div class="dialog-body"><div class="form-grid"><label class="field">Thời hạn đề nghị<input name="due" type="datetime-local" value="${localDate(t.due)}" required></label><label class="field">Trạng thái đề nghị<select name="status">${TASK_STATUS.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field full">Lý do / thông tin xác nhận<textarea name="reason" required placeholder="Giải thích đề nghị để Lan kiểm tra..."></textarea></label></div><div class="alert" style="margin-top:18px">${icon('info')}Yêu cầu do người dùng bổ sung, không phải kết quả AI trích xuất. Công việc hiện hành được giữ nguyên đến khi Lan duyệt.</div></div><div class="dialog-footer">${button('Quay lại','close-dialog')}<button class="btn primary" type="submit">Gửi yêu cầu mô phỏng</button></div></form>`}
 if(type==='reset')return dialogHead('Đặt lại dữ liệu demo?','Khôi phục trạng thái mẫu ban đầu')+`<div class="dialog-body"><p class="small muted">Các thao tác duyệt, nhắc việc, kịch bản và dữ liệu nhập trong prototype sẽ được thay bằng dữ liệu mẫu. Tài liệu PRD và các file trong thư mục không bị tác động.</p></div><div class="dialog-footer">${button('Giữ phiên hiện tại','close-dialog')}${button('Đặt lại demo','confirm-reset','','primary','refresh')}</div>`;
 if(type==='scenarios')return dialogHead('Bạn muốn thử tình huống nào?','Mỗi kịch bản có thể bắt đầu và đặt lại độc lập.')+`<div class="dialog-body"><div class="scenario-grid">${SCENARIOS.map(([key,n,d],i)=>`<button class="scenario-card" data-act="scenario" data-id="${key}"><span class="scenario-num">${String(i+1).padStart(2,'0')}</span><span><h3>${n}</h3><p>${d}</p></span></button>`).join('')}</div></div>`;
 if(type==='reset-scenario')return dialogHead('Bắt đầu lại kịch bản này?')+`<div class="dialog-body"><p class="small muted">Chỉ dữ liệu mẫu của kịch bản “${esc(SCENARIOS.find(s=>s[0]===id)?.[1]||'')}” được khởi tạo lại. Các kịch bản khác và công việc ban đầu được giữ nguyên.</p></div><div class="dialog-footer">${button('Tiếp tục phiên cũ','resume-scenario',id)}${button('Bắt đầu lại','restart-scenario',id,'primary','refresh')}</div>`;
 if(type==='proposal'){const p=getProposal(id);return p?dialogHead('Kiểm tra đề xuất','AI mô phỏng · Chỉ áp dụng sau xác nhận')+`<div class="dialog-body">${proposalCard(p)}</div>`:dialogContent('access')}
 if(type==='reject'||type==='request-clarify'){const p=getProposal(id);if(!p)return dialogContent('access');return dialogHead(type==='reject'?'Bác bỏ đề xuất':'Yêu cầu làm rõ',esc(p.title))+`<form id="reason-form" data-id="${esc(id)}" data-mode="${type}"><div class="dialog-body"><label class="field">${type==='reject'?'Lý do bác bỏ':'Câu hỏi cần làm rõ'}<textarea name="reason" required placeholder="${type==='reject'?'Ví dụ: Công việc đã được tạo trong một luồng khác.':'Bạn cần xác nhận thêm thông tin gì?'}"></textarea></label><p class="small muted" style="margin-top:12px">Phản hồi được ghi vào dữ liệu và lịch sử mô phỏng; không gửi đến dịch vụ chat thật.</p></div><div class="dialog-footer">${button('Quay lại','close-dialog')}<button class="btn primary" type="submit">${type==='reject'?'Bác bỏ và lưu lý do':'Gửi yêu cầu'}</button></div></form>`}
 if(type==='clarify'||type==='edit-proposal'){const p=getProposal(id);if(!p)return dialogContent('access');const clarify=type==='clarify';return dialogHead(clarify?'Cùng làm rõ cam kết này':'Chỉnh sửa đề xuất',esc(p.title))+`<form id="proposal-form" data-id="${esc(id)}" data-mode="${type}"><div class="dialog-body">${clarify?`<div class="alert amber">${icon('chat')}<div>${esc(p.reason||'Kiểm tra và bổ sung các trường trước khi gửi phản hồi.')}</div></div><div style="margin-top:15px">${p.evidence.map(source=>`<div class="clarity-quote">#${esc(source)} · “${esc(getConv(p.conv)?.messages.find(m=>m.id===source)?.deleted?'Nguồn đã bị xóa':getConv(p.conv)?.messages.find(m=>m.id===source)?.text||'')}”</div>`).join('')}</div>${p.ambiguous?`<fieldset style="border:0;padding:0;margin:18px 0"><legend style="font-size:12px;font-weight:600">“Mai” là tên người hay thời điểm ngày mai?</legend><label class="radio-option"><input type="radio" name="meaning" value="person" ${p.meaning==='person'?'checked':''}>Là tên Mai — chọn Mai làm người phụ trách</label><label class="radio-option"><input type="radio" name="meaning" value="tomorrow" ${p.meaning==='tomorrow'?'checked':''}>Là ngày mai (17/11/2026) — vẫn cần xác định người và giờ cụ thể</label><label class="radio-option"><input type="radio" name="meaning" value="other" ${p.meaning==='other'?'checked':''}>Chưa thể xác định / bổ sung cách hiểu khác</label></fieldset>`:''}`:''}<div class="form-grid" style="margin-top:20px"><label class="field full">Tên công việc<input name="title" value="${esc(p.title)}" required maxlength="180"></label><label class="field">Người phụ trách<select name="owner"><option value="">Chưa xác định</option>${PEOPLE.map(n=>`<option ${p.owner===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Thời hạn cụ thể<input name="due" type="datetime-local" value="${localDate(p.due)}"><span class="hint">Asia/Ho_Chi_Minh · Không tự suy đoán ngày hoặc giờ.</span></label><label class="field full">Trạng thái công việc<select name="taskStatus">${TASK_STATUS.map(s=>`<option ${p.taskStatus===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field full">Thông tin bổ sung<textarea name="feedback" placeholder="Ghi rõ cách hiểu, nguồn xác nhận hoặc điều bạn muốn đề nghị..." style="min-height:85px">${esc(p.feedback||'')}</textarea><span class="hint">Các trường được sửa sẽ gắn nhãn “Do người dùng bổ sung”.</span></label></div><div class="preview-box" id="clarify-preview"></div><div class="alert" style="margin-top:17px">${icon('info')}${isLead()?'Chỉ có thể xác nhận khi tên việc, người phụ trách, thời hạn và nguồn hợp lệ đã đủ. Bạn cũng có thể lưu bổ sung để tiếp tục làm rõ.':'Phản hồi của Nam được gửi vào hàng chờ để Lan kiểm tra. Chưa áp dụng thay đổi chính thức.'}</div></div><div class="dialog-footer">${button('Quay lại','close-dialog')}<button class="btn" type="submit" name="intent" value="save">${isLead()?'Lưu bổ sung':'Gửi phản hồi'}</button>${isLead()?'<button class="btn primary" type="submit" name="intent" value="approve">Lưu và xác nhận</button>':''}</div></form>`}
 if(type==='detail'){const t=getTask(id);if(!t)return dialogContent('access');const tabs=[['overview','Tổng quan'],['evidence','Bằng chứng'],['history','Lịch sử thay đổi'],['reminders','Nhắc việc']];return dialogHead(esc(t.title),`${esc(t.id)} · Đã xác nhận · ${esc(getConv(t.conv)?.title||'')}`)+`<div class="dialog-body"><div class="tabs" aria-label="Chi tiết công việc">${tabs.map(([k,l])=>`<button class="tab ${ui.detailTab===k?'active':''}" data-act="detail-tab" data-id="${k}">${l}</button>`).join('')}</div>${detailContent(t)}</div>`}

function detailContent(t){
 if(ui.detailTab==='overview'){const updates=pending().filter(p=>p.taskId===t.id);return `<div class="row wrap">${pill(t.status)}${overdue(t)?pill('Quá hạn','red'):''}${t.review?pill('Cần rà soát nguồn','amber'):''}${noteMark('F08')}</div><div class="detail-grid"><div class="detail-item"><small>Người phụ trách</small><strong class="row">${avatar(t.owner)}${esc(t.owner)}</strong></div><div class="detail-item"><small>Thời hạn hiện hành</small><strong>${fullDate(t.due)}</strong></div><div class="detail-item"><small>Hội thoại / Chủ đề</small><strong># ${esc(getConv(t.conv)?.title||'')}<br>${esc(getConv(t.conv)?.topic||'')}</strong></div><div class="detail-item"><small>Người và thời điểm xác nhận</small><strong>${esc(t.confirmedBy)} · ${fullDate(t.confirmedAt)}</strong></div></div><p class="small muted">${esc(t.description)}</p>${t.manual?.length?`<div class="alert amber" style="margin-top:20px">${icon('edit')}Do người dùng bổ sung: ${esc(t.manual.join(', '))}.</div>`:''}${t.review?`<div class="alert amber" style="margin-top:20px">${icon('info')}Nguồn đã thay đổi. Bằng chứng hiện tại cần được kiểm tra lại.${isLead()?button('Rà soát nguồn','review-source',t.id,'sm'):''}</div>`:''}${updates.length?`<div class="divider"></div><h3>Đề xuất cập nhật đang chờ (${updates.length})</h3>${updates.map(p=>`<div class="row between wrap" style="margin-top:12px"><span class="small muted">${kindLabel(p.kind)} · ${p.status}</span>${button('Kiểm tra đề xuất','proposal',p.id,'sm','arrow')}</div>`).join('')}`:''}<div class="divider"></div><div class="row wrap">${isLead()?button('Đề xuất nhắc việc','new-reminder',t.id,'primary','bell'):button('Gửi yêu cầu chỉnh sửa','member-request',t.id,'primary','edit')}${button('Xem bằng chứng','detail-tab','evidence','','link')}</div>`}
 if(ui.detailTab==='evidence'){return `<div class="row between"><h3>Tin nhắn làm bằng chứng ${noteMark('F08')}</h3>${t.review?pill('Cần rà soát','amber'):pill('Đã xác nhận','green')}</div><p class="small muted" style="margin-top:9px">Bấm nguồn để mở đúng tin nhắn trong hội thoại và xem ngữ cảnh.</p>${t.evidence.map(s=>{const m=getConv(t.conv)?.messages.find(m=>m.id===s);return `<button class="evidence-link" data-act="evidence" data-id="${esc(t.conv)}|${esc(s)}">${icon('link')}<span class="grow">#${esc(s)} · ${m?.deleted?'Nguồn đã bị xóa':esc(m?.text||'Nguồn không khả dụng')}${m?.revision?' · Cần rà soát':''}</span>${icon('arrow')}</button>`}).join('')}<div class="divider"></div><div class="row wrap">${isLead()?button('Mô phỏng sửa/xóa nguồn','source',t.id,'','edit'):''}${isLead()&&t.review?button('Rà soát bằng chứng','review-source',t.id,'primary','shield'):''}</div>`}
 if(ui.detailTab==='history')return `<div class="row between" style="margin-bottom:22px"><h3>Quyết định qua từng mốc ${noteMark('F08')}</h3><span class="small muted">Mới nhất ở trên</span></div><div class="timeline">${t.history.slice().reverse().map((h,i)=>`<article class="timeline-item">${pill(h.type,h.type==='Đã áp dụng'?'green':h.type==='Bị bác bỏ'?'red':'amber')}<h3>${esc(h.label)}</h3><small>${esc(h.actor)} · ${fullDate(h.at)} · Mốc ${t.history.length-i}</small>${h.before||h.after?`<div class="compare"><div><small>Trước</small>${h.before?esc(stateLabel(h.before)):'Chưa có công việc'}</div><div><small>${h.type==='Được đề xuất'?'Đề xuất (chưa hiệu lực)':'Sau'}</small>${h.after?esc(stateLabel(h.after)):'Giữ thông tin hiện hành'}</div></div>`:''}${h.note?`<p>${esc(h.note)}</p>`:''}<div class="row wrap">${(h.sources||[]).map(s=>`<button class="link-btn" data-act="evidence" data-id="${esc(t.conv)}|${esc(s)}">#${esc(s)} ${icon('link')}</button>`).join('')}</div><details style="margin-top:10px"><summary class="small blue" style="cursor:pointer">Xem trạng thái có hiệu lực tại mốc này</summary><div class="snapshot">${esc(stateLabel(effectiveAt(t,t.history.length-i-1)))}<br>Quyết định cũ vẫn được giữ; mốc đề xuất hoặc bác bỏ không áp dụng thay đổi.</div></details></article>`).join('')}</div>`;

<script>
function addHistory(t,type,label,before,after,sources=[],note='',actor=db.user){t.history.push({type,label,before:clone(before),after:clone(after),sources:clone(sources),note,actor,at:DEMO_NOW})}
function approveProposal(id){
 if(!requireLead())return false;const p=getProposal(id);if(!p||!['Chờ duyệt','Cần làm rõ'].includes(p.status)){toast('Đề xuất không còn ở trạng thái chờ xử lý.',true);return false}
 if(!p.title.trim()||!p.owner||!p.due||!Number.isFinite(new Date(p.due).getTime())){toast('Cần bổ sung tên việc, người phụ trách và thời hạn cụ thể trước khi xác nhận.',true);return false}
 const c=getConv(p.conv),sources=p.evidence.map(id=>c?.messages.find(m=>m.id===id));
 if(!sources.length||sources.some(m=>!m||m.deleted||((p.sourceRevisions?.[m.id]??0)!==(m.revision??0)))){toast('Bằng chứng đã thay đổi hoặc không còn hợp lệ. Hãy kiểm tra nguồn và phân tích lại.',true);return false}
 if(p.ambiguous&&!p.clarified){toast('Hãy chọn cách hiểu của “Mai” và làm rõ trước khi xác nhận.',true);openDialog('clarify',id);return false}
 let t=p.taskId?getTask(p.taskId):null;
 if(p.taskId&&!t){toast('Công việc gốc không khả dụng trong phạm vi hiện tại.',true);return false}
 if(t&&p.baseSnapshot&&JSON.stringify(snap(t))!==JSON.stringify(p.baseSnapshot)){toast('Thông tin hiện hành đã thay đổi. Phân tích lại để tạo đề xuất theo trạng thái mới.',true);return false}
 const before=t?snap(t):null;
 if(!t){const existing=db.tasks.find(t=>t.conv===p.conv&&t.evidence.some(id=>p.evidence.includes(id)));if(existing){toast('Nguồn này đã có công việc xác nhận, không tạo trùng.',true);return false}t={id:'T-'+hash(p.id),title:p.title,owner:p.owner,due:p.due,status:p.taskStatus,conv:p.conv,evidence:clone(p.evidence),description:p.feedback||'Công việc được xác nhận từ hội thoại minh họa. Mở bằng chứng để xem đầy đủ ngữ cảnh.',confirmedBy:db.user,confirmedAt:DEMO_NOW,manual:clone(p.manual||[]),review:false,history:[]};db.tasks.push(t);p.taskId=t.id}
 else{if(t.due!==p.due)db.reminders.filter(r=>r.taskId===t.id&&r.status!=='Đã hủy'&&r.status!=='Đã gửi mô phỏng').forEach(r=>{r.review=true;reminderLog(r,'Deadline task thay đổi — cần rà soát',clone(r))});t.title=p.title;t.owner=p.owner;t.due=p.due;t.status=p.taskStatus;t.manual=[...new Set([...(t.manual||[]),...(p.manual||[])])];t.evidence=[...new Set([...t.evidence,...p.evidence])];t.confirmedBy=db.user;t.confirmedAt=DEMO_NOW;if(t.status==='Đã hủy'||t.status==='Hoàn thành')db.reminders.filter(r=>r.taskId===t.id&&['Chờ duyệt','Đã duyệt'].includes(r.status)).forEach(r=>{r.review=true;reminderLog(r,'Task kết thúc — cần rà soát',clone(r))})}
 p.status='Đã duyệt';p.reviewedBy=db.user;p.reviewedAt=DEMO_NOW;p.reason='';
 addHistory(t,'Đã áp dụng',before?kindLabel(p.kind):'Xác nhận tạo công việc',before,snap(t),p.evidence,p.manual?.length?'Do người dùng bổ sung: '+p.manual.join(', '):'');

 const cleaned=list.map((x,i)=>{if(!x||typeof x!=='object'||!['id','sender','text','time'].every(k=>typeof x[k]==='string'&&x[k].trim()))throw Error(`Tin ${i+1} thiếu trường bắt buộc: id, sender, text, time (chuỗi).`);if(!/^[a-zA-Z0-9_-]{1,80}$/.test(x.id))throw Error(`ID tin ${i+1} chỉ gồm chữ không dấu, số, gạch ngang hoặc gạch dưới; tối đa 80 ký tự.`);if(ids.has(x.id))throw Error(`Trùng ID “${x.id}” trong tệp. Mỗi tin cần ID duy nhất.`);ids.add(x.id);if(!PEOPLE.includes(x.sender))throw Error(`Người gửi tin ${i+1} không thuộc nhóm A.`);if(!Number.isFinite(new Date(x.time).getTime())||!/(Z|[+-]\d{2}:\d{2})$/.test(x.time))throw Error(`Thời gian tin ${i+1} cần định dạng ISO có múi giờ, ví dụ 2026-11-16T08:30:00+07:00.`);if(x.replyTo!=null&&typeof x.replyTo!=='string')throw Error(`replyTo của tin ${i+1} phải là ID chuỗi hoặc null.`);return {id:x.id,sender:x.sender,text:x.text.trim(),time:x.time,replyTo:x.replyTo||null,revision:0,deleted:false}});
 for(const x of cleaned)if(x.replyTo&&(!ids.has(x.replyTo)||x.replyTo===x.id))throw Error(`Liên kết trả lời của “${x.id}” không hợp lệ hoặc không có trong dữ liệu nhập.`);
 const existing=[];for(const x of cleaned){for(const c of db.conversations){const old=c.messages.find(m=>m.id===x.id);if(old){if(!canConv(c.id)||old.sender!==x.sender||old.text!==x.text||old.time!==x.time||old.replyTo!==x.replyTo)throw Error('ID đã được sử dụng cho dữ liệu khác. Hãy dùng ID mới hoặc nhập lại đúng nguồn.');existing.push(c.id)}}}
 if(existing.length&&existing.length!==cleaned.length)throw Error('Dữ liệu trộn ID đã nhập và ID mới. Hãy nhập lại đúng bộ cũ hoặc dùng toàn bộ ID mới.');if(new Set(existing).size>1)throw Error('Một lần nhập chỉ được thuộc cùng một hội thoại.');return {messages:cleaned,existingConv:existing[0]||null};
}
function commitImport(){if(!ui.importPreview)return;try{const validated=parseImport(ui.importDraft,ui.importMode);if(validated.existingConv){ui.selectedConv=validated.existingConv;toast('Đã mở hội thoại đã nhập. Không tạo tin hoặc công việc trùng.')}else{const id='import-'+hash(validated.messages.map(m=>m.id).join('|'));db.conversations.push({id,title:'Hội thoại nhập thử',topic:'Dữ liệu xem trước',members:PEOPLE,messages:validated.messages,persist:false});ui.selectedConv=id;toast('Đã nhập vào bộ nhớ tab. Chưa phân tích và chưa tạo công việc.')}ui.page='conversations';ui.analysis=null;ui.highlight=null;ui.importPreview=null;ui.importDraft='';closeDialog();render()}catch(e){ui.importError=e.message;openDialog('import')}}
function downloadSample(){const messages=[m('JSON-01','Lan',SAMPLE_TEXT.report),m('JSON-02','Lan',SAMPLE_TEXT.ambiguous,'08:31')];const blob=new Blob([JSON.stringify({messages},null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chat22-hoi-thoai-mau.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã tải tệp JSON mẫu. Dùng Nhập tệp JSON để xem trước.')}
</script>
<script>
function navigate(page){if(DIALOG.open)closeDialog();ui.page=page;ui.menu=false;ui.highlight=null;render();document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function refreshOpenDetail(){render();if(ui.modal?.type==='detail')openDialog('detail',ui.modal.id)}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-act],[data-go]');if(!target)return;if(target.dataset.go){navigate(target.dataset.go);return}const action=target.dataset.act,id=target.dataset.id||'';
 if(action==='menu'){ui.menu=!ui.menu;document.body.classList.toggle('menu-open',ui.menu);return}
 if(action==='close-dialog'){closeDialog();return}if(action==='note'){if(DIALOG.open){showModalNote(id);return}ui.note=id;render();return}if(action==='close-modal-note'){DIALOG.querySelector('.inline-note')?.remove();return}if(action==='close-note'){ui.note=null;render();return}if(action==='note-guide'){ui.note=null;navigate('guide');return}
 if(action==='scope'){if(id==='team'&&!isLead())return deny();ui.scope=id;render();return}
 if(action==='inbox-tab'){ui.tab=id;ui.status='';render();return}
 if(action==='clear-filters'){Object.assign(ui,{search:'',owner:'',status:'',due:'',conv:''});render();return}
 if(action==='set-role'){if(!['Lan','Nam'].includes(id))return;analysisToken++;ui.busy=false;db.user=id;Object.assign(ui,{scope:id==='Lan'?'team':'mine',owner:'',status:'',due:'',conv:'',search:'',note:null,highlight:null,analysis:null});closeDialog();if(!canConv(ui.selectedConv))ui.selectedConv='launch';save();render();toast(`Đang dùng ${id} — ${id==='Lan'?'Trưởng nhóm':'Thành viên'}. Quyền và phạm vi đã cập nhật.`);return}
 if(action==='confirm-reset'){analysisToken++;db=initial();ui={...ui,page:'tasks',scope:'team',tab:'confirmed',search:'',owner:'',status:'',due:'',conv:'',selectedConv:'launch',reviewFilter:'pending',note:null,highlight:null,busy:false,analysis:null,failNext:false,menu:false,importDraft:'',importPreview:null};save();closeDialog();render();toast('Đã khôi phục dữ liệu mẫu ban đầu.');return}
 if(['role','reset','scenarios','access','import'].includes(action)){if(action==='import'){ui.importPreview=null;ui.importDraft='';ui.importError=''}openDialog(action,id);return}
 if(action==='scenario'){startScenario(id);return}if(action==='restart-scenario'){startScenario(id,true);return}if(action==='resume-scenario'){ui.selectedConv='sample-'+id;closeDialog();ui.page='conversations';ui.analysis=null;render();return}
 if(action==='go-chat'){navigate('conversations');return}if(action==='go-review'){navigate('review');return}
 if(action==='conv'||action==='open-conv'){if(!canConv(id))return deny();if(DIALOG.open)closeDialog();ui.selectedConv=id;ui.highlight=null;ui.analysis=null;ui.page='conversations';render();return}
 if(action==='evidence'){const [conv,msg]=id.split('|');const c=getConv(conv);if(!c||!c.messages.some(m=>m.id===msg))return deny();if(DIALOG.open)closeDialog();ui.selectedConv=conv;ui.highlight=msg;ui.analysis=null;ui.page='conversations';render();return}
 if(action==='analyze'){startAnalysis();return}if(action==='fail-next'){ui.failNext=true;toast('Lần phân tích tiếp theo sẽ mô phỏng lỗi; bấm Phân tích hội thoại để thử.');return}
 if(action==='detail'){const t=getTask(id);if(!t)return deny();ui.detailId=id;ui.detailTab='overview';openDialog('detail',id);return}
 if(action==='detail-tab'){ui.detailTab=id;const tid=ui.modal?.id||ui.detailId;if(getTask(tid))openDialog('detail',tid);else deny();return}
 if(['proposal','clarify','edit-proposal','reject','request-clarify','source','review-source','member-request','reminder-history','eval-sample'].includes(action)){if(['reject','source','review-source'].includes(action)&&!requireLead())return;openDialog(action,id);return}
 if(action==='approve'){if(approveProposal(id)&&DIALOG.open)closeDialog();return}
 if(action==='new-reminder'||action==='edit-reminder'){if(requireLead())openDialog(action,id);return}
 if(['approve-reminder','send-reminder','cancel-reminder'].includes(action)){const mode={'approve-reminder':'approve','send-reminder':'send','cancel-reminder':'cancel'}[action];if(changeReminder(id,mode)){const current=ui.modal?.type==='detail'?ui.modal.id:null;render();if(current)openDialog('detail',current);toast(mode==='approve'?'Đã duyệt nhắc việc. Bạn có thể mô phỏng đến giờ gửi.':mode==='send'?'Đã gửi mô phỏng tại thời điểm nhắc. Không có thông báo thật.':'Đã hủy lời nhắc.')}return}
 if(action==='download'){downloadSample();return}
 if(action==='import-mode'){ui.importDraft=document.getElementById('import-text')?.value||ui.importDraft;ui.importMode=id;ui.importPreview=null;ui.importError='';openDialog('import');return}
 if(action==='fill-import'){ui.importDraft=ui.importMode==='text'?`Lan: ${SAMPLE_TEXT.report}\nLan: ${SAMPLE_TEXT.ambiguous}`:JSON.stringify({messages:[m('JSON-01','Lan',SAMPLE_TEXT.report),m('JSON-02','Lan',SAMPLE_TEXT.ambiguous,'08:31')]},null,2);ui.importPreview=null;ui.importError='';openDialog('import');return}
 if(action==='commit-import'){commitImport();return}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='task-search'){const position=el.selectionStart;ui.search=el.value;render();const updated=document.getElementById('task-search');updated.focus();updated.setSelectionRange(position,position)}
 if(el.id==='import-text'){ui.importDraft=el.value;if(ui.importPreview){ui.importPreview=null;DIALOG.querySelector('[data-act="commit-import"]')?.remove();DIALOG.querySelector('.import-preview')?.remove()}}
 if(el.closest('#proposal-form'))updateClarifyPreview();
});
document.addEventListener('change',async event=>{
 const el=event.target;
 if(el.id==='notes-toggle'){db.notes=el.checked;if(!db.notes)ui.note=null;save();render();return}
 const filters={'filter-owner':'owner','filter-due':'due','filter-status':'status','filter-conv':'conv','review-filter':'reviewFilter'};
 if(filters[el.id]){ui[filters[el.id]]=el.value;render();return}
 if(el.dataset.check){db.checklist[el.dataset.check]=el.checked;save();return}
 if(el.name==='meaning'){if(el.value==='person'){const owner=DIALOG.querySelector('[name="owner"]');owner.value='Mai'}updateClarifyPreview();return}
 if(el.id==='import-file'){const file=el.files?.[0];if(!file)return;if(file.size>200000){ui.importError='Tệp vượt giới hạn 200 KB của prototype.';openDialog('import');return}try{ui.importDraft=await file.text();ui.importPreview=null;ui.importError='';if(ui.modal?.type==='import')openDialog('import')}catch{ui.importError='Không đọc được tệp. Thử chọn tệp JSON khác.';openDialog('import')}return}
 if(el.name==='source'){const t=getTask(ui.modal?.id),msg=getConv(t?.conv)?.messages.find(m=>m.id===el.value);if(msg)DIALOG.querySelector('[name="text"]').value=msg.text;return}
 if(el.name==='taskId'&&el.closest('#reminder-form')){const t=getTask(el.value);if(t){const f=el.form;f.elements.recipient.value=t.owner;f.elements.content.value=`${t.owner} ơi, “${t.title}” có hạn ${fullDate(t.due)}. Bạn cập nhật tiến độ giúp nhóm nhé.`}return}
 if(el.closest('#proposal-form'))updateClarifyPreview();
});
document.addEventListener('submit',event=>{
 const form=event.target;if(!['proposal-form','reason-form','reminder-form','source-form','review-source-form','import-form','member-request-form'].includes(form.id))return;event.preventDefault();const data=new FormData(form),intent=event.submitter?.value;
 if(form.id==='proposal-form'){submitProposal(form,intent);return}
 if(form.id==='reason-form'){const reason=String(data.get('reason')||'').trim();if(!reason){toast('Cần nhập nội dung phản hồi.',true);return}const p=getProposal(form.dataset.id);if(!p)return;if(form.dataset.mode==='reject'){if(!rejectProposal(p.id,reason))return}else{p.status='Cần làm rõ';p.reason=reason;const t=getTask(p.taskId);if(t)addHistory(t,'Cần làm rõ','Yêu cầu bổ sung thông tin',snap(t),snap(t),p.evidence,reason);save()}closeDialog();render();toast(form.dataset.mode==='reject'?'Đã bác bỏ, lưu lý do và giữ dữ liệu hiện hành.':'Đã ghi yêu cầu làm rõ trong mô phỏng.');return}
 if(form.id==='reminder-form'){const existing=visibleReminders().find(r=>r.id===form.dataset.id);const next={taskId:existing?.taskId||data.get('taskId'),recipient:data.get('recipient'),at:data.get('at')?iso(data.get('at')):null,content:String(data.get('content')||'')};if(storeReminder(next,form.dataset.id)){closeDialog();render();toast('Đã lưu bản nháp chờ duyệt. Chưa kích hoạt nhắc việc.')}return}
 if(form.id==='source-form'){const text=String(data.get('text')||'').trim();if(intent!=='delete'&&!text){toast('Cần nhập nội dung thay thế.',true);return}if(changeSource(form.dataset.id,data.get('source'),text,intent==='delete')){ui.detailTab='evidence';const id=form.dataset.id;render();openDialog('detail',id);toast('Nguồn đã thay đổi. Công việc liên quan được đánh dấu Cần rà soát.')}return}
 if(form.id==='review-source-form'){if(!requireLead())return;const t=getTask(form.dataset.id),sources=data.getAll('sources'),reason=String(data.get('reason')||'').trim();if(!t||!sources.length||!reason){toast('Chọn ít nhất một nguồn hiện có và nhập ghi chú rà soát.',true);return}if(sources.some(s=>!getConv(t.conv)?.messages.some(m=>m.id===s&&!m.deleted))){toast('Nguồn không hợp lệ.',true);return}const old=[...t.evidence];t.evidence=sources;t.review=false;addHistory(t,'Đã áp dụng','Xác nhận bằng chứng sau rà soát',snap(t),snap(t),sources,`${reason} · Nguồn cũ: ${old.join(', ')}. Nhắc việc vẫn cần rà soát riêng.`);save();ui.detailTab='evidence';render();openDialog('detail',t.id);toast('Đã xác nhận bằng chứng. Nhắc việc liên quan vẫn cần rà soát riêng.');return}
 if(form.id==='import-form'){ui.importDraft=String(document.getElementById('import-text').value);try{const parsed=parseImport(ui.importDraft,ui.importMode);ui.importPreview=parsed.messages;ui.importConv=parsed.existingConv;ui.importError=''}catch(e){ui.importError=e.message;ui.importPreview=null}openDialog('import');return}
 if(form.id==='member-request-form'){const t=getTask(form.dataset.id),reason=String(data.get('reason')||'').trim();if(!t||!reason)return;const due=iso(data.get('due')),status=String(data.get('status'));if(due===new Date(t.due).toISOString()&&status===t.status){toast('Hãy thay đổi thời hạn hoặc trạng thái để gửi yêu cầu.',true);return}const fingerprint='member|'+t.id+'|'+hash(due+status+reason);if(db.proposals.some(p=>p.fingerprint===fingerprint)){toast('Yêu cầu này đã được gửi, không tạo trùng.',true);return}const p={id:'Q-'+hash(fingerprint),fingerprint,kind:status!==t.status?(status==='Hoàn thành'?'complete':status==='Đã hủy'?'cancel':'deadline'):'deadline',title:t.title,owner:t.owner,due,taskStatus:status,conv:t.conv,taskId:t.id,evidence:clone(t.evidence),status:'Chờ duyệt',reason:'Yêu cầu do thành viên bổ sung, cần Lan kiểm tra.',manual:['Thời hạn / trạng thái'],feedback:reason,respondedBy:db.user,createdAt:DEMO_NOW,sourceRevisions:Object.fromEntries(t.evidence.map(id=>[id,getConv(t.conv)?.messages.find(m=>m.id===id)?.revision||0])),baseSnapshot:snap(t)};db.proposals.push(p);addHistory(t,'Được đề xuất','Yêu cầu chỉnh sửa của thành viên',snap(t),{title:t.title,owner:t.owner,due,status},t.evidence,reason);save();closeDialog();render();toast('Đã gửi yêu cầu mô phỏng. Công việc chính thức được giữ nguyên.');return}
});
DIALOG.addEventListener('cancel',()=>{ui.modal=null});
DIALOG.addEventListener('click',event=>{if(event.target===DIALOG){const r=DIALOG.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog()}});
render();save();
</script>
